name: Engineering portal release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-portal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node scripts/engineering-release.mjs check
  security:
    uses: colintandyonline/.github/.github/workflows/secret-scan.yml@27b5865790be9e605b56368b7fa86fa91f530d73
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || vars.ENGINEERING_DEPLOY_ENABLED == 'true')
    needs: [check, security]
    runs-on: ubuntu-latest
    environment: engineering-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node scripts/engineering-release.mjs deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ENGINEERING_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_ID: ${{ vars.CLOUDFLARE_WORKER_ID }}
